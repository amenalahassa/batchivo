# Redis Network Policy
# Redis is used for caching, session storage and as the Celery broker
#
# Ingress:
#   - Backend pods
#   - Celery worker pods (broker and result backend)
#
# Egress:
#   - None required (Redis is an in-memory data store)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: batchivo
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from backend
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 6379
    # Allow ingress from the Celery worker: Redis is its broker and result
    # backend (task T120, research.md D4)
    - from:
        - podSelector:
            matchLabels:
              app: celery-worker
      ports:
        - protocol: TCP
          port: 6379
  egress: []  # No egress needed
