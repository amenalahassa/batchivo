[project]
name = "batchivo-backend"
version = "0.2.0-alpha"
description = "Batchivo - Production tracking and ecommerce platform for makers"
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [
    {name = "Jonathan", email = "jonathan@techize.com"}
]
dependencies = [
    "fastapi>=0.124.4",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "psycopg[binary,pool]>=3.1.0",
    "asyncpg>=0.31.0",
    "redis>=5.0.0",
    "authlib>=1.6.9",
    "PyJWT>=2.12.0",
    "bcrypt>=4.0.0",
    "httpx>=0.26.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "celery[redis]>=5.3.0",
    "qrcode[pil]>=7.4.0",
    "pillow>=12.2.0",
    "python-multipart>=0.0.22",
    "aiosqlite>=0.21.0",
    "pyyaml>=6.0.0",
    "squareup>=42.0.0",
    "slowapi>=0.1.9",
    "starlette>=1.3.1,<2",
    "boto3>=1.35.0",
    "paho-mqtt>=2.1.0",
    "dnspython>=2.7.0",
    "etsyv3>=0.0.7",
    "sentry-sdk[fastapi]>=2.0.0",
    "werkzeug (>=3.1.6)",
    "cryptography (>=46.0.6)",
    "requests (>=2.33.0)",
    "greenlet (>=3.2.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "black>=26.3.1",
    "pygments>=2.20.0",
    "ruff>=0.8.4",
    "mypy>=1.8.0",
    "httpx>=0.26.0",
    "fakeredis>=2.32.1",
    "moto[s3]>=5.0.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "app"}]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the established rule set explicit across Ruff default changes.
select = ["E4", "E7", "E9", "F"]
# F821: Undefined name - SQLAlchemy uses string annotations for relationships
# E402: Module level import not at top - intentional for conditional imports
ignore = ["F821", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The database engine and its schema are built once per session (see
# tests/conftest.py); a connection pool opened on one event loop cannot be
# used from another, so the tests and their fixtures share the session loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
timeout = 300
timeout_method = "thread"

# The money paths are held to a stricter standard than the rest of the app
# (research.md D8). mypy cannot ban a builtin type, so this tightens everything
# around it and tests/unit/pricing/test_no_float_in_money_paths.py bans `float`.
[[tool.mypy.overrides]]
module = [
    "app.services.costing",
    "app.services.landed_cost",
    "app.services.fee_engine",
    "app.services.pricing_solver",
    "app.services.channel_pnl",
    # Added in task T137, alongside the float ban: these arrived with later
    # tiers and handle money or a rate just as the five above do.
    "app.services.cost_resolution",
    "app.services.provenance",
    "app.services.pricing_policy",
    "app.services.scenario_service",
    "app.services.fx_service",
    "app.services.temporal_pricing",
    "app.services.realised_margin",
    # The dated channel economics (task T136) and the realised-versus-planned
    # comparison (task T134).
    "app.services.channel_economics",
    "app.services.margin_alert",
    # The books-to-sale currency edge and the frozen order-line snapshot
    # (tasks T231, T232); `tenant_cost_settings` was removed and left here.
    "app.services.currency_edge",
    "app.services.sale_snapshot",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
warn_unreachable = true
