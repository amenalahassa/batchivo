# Dedicated PostgreSQL for the backend test suites.
#
# Kept apart from the dev database (docker-compose.yml, port 5432) so a test run can
# never exhaust or degrade it. Each pytest-xdist worker builds the whole schema in its
# own database, and every table takes entries in the shared lock table, so
# max_locks_per_transaction is raised well above the default of 64. Durability is
# switched off and data lives in tmpfs: this database is disposable by design.
#
#   docker compose -f docker-compose.test.yml up -d
#   pwsh backend/scripts/run_ci_tests.ps1        (or: sh backend/scripts/run_ci_tests.sh)

# Its own project name, so Compose never sees the dev containers as orphans of this
# file (and a `--remove-orphans` here can never remove them).
name: batchivo-test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: batchivo-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_batchivo
    command:
      - postgres
      - -c
      - max_locks_per_transaction=1024
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infrastructure/test-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Probe the last database init.sql creates over TCP: pg_isready on the socket
      # already succeeds against the temporary server first boot runs init.sql on.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U test -d test_batchivo_gw3 -tAc 'select 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
